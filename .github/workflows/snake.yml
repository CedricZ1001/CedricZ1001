name: Generate Snake

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-contribution-snake
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#0e7490&color_dots=#ebedf0,#c9eaf4,#8fd6e9,#4fb8d8,#5bcdec
            dist/snake-dark.svg?color_snake=#5bcdec&color_dots=#161b22,#1a3f4a,#1d6478,#2f9db8,#5bcdec

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
